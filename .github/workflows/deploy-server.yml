name: 后端 CI - 构建与检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: heat_treatment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 后端构建
        run: npm run build:server
        env:
          NODE_ENV: production

      - name: 前端构建
        run: npm run build:client

      - name: 类型检查（前端）
        run: npx tsc --noEmit --project tsconfig.app.json 2>&1 || echo "⚠️ 类型检查有警告（不阻塞构建）"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: dist/server/
          retention-days: 7
