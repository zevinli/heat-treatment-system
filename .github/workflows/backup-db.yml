name: 自动备份数据库

on:
  schedule:
    # 每天凌晨 3:00 (北京时间 11:00) 自动备份
    - cron: '0 3 * * *'
  # 也可以手动触发
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PostgreSQL 客户端
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: 执行备份
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backups/heat_treatment_${TIMESTAMP}.sql.gz"
          
          echo "📦 备份中..."
          pg_dump "${{ secrets.RAILWAY_DB_URL }}" \
            --clean --if-exists --no-owner --no-acl \
            | gzip > "$BACKUP_FILE"
          
          SIZE=$(ls -lh "$BACKUP_FILE" | awk '{print $5}')
          echo "✅ 备份完成: $SIZE"
          
          # 清理 30 天前的旧备份
          find backups/ -name "*.sql.gz" -mtime +30 -delete
        env:
          PGPASSWORD: ${{ secrets.RAILWAY_DB_PASSWORD }}

      - name: 上传备份为 GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30

      - name: 上传备份为 GitHub Release（可选，长久保存）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ github.run_id }}
          name: "数据库备份 $(date +%Y-%m-%d)"
          files: backups/*.sql.gz
          body: |
            ## 自动备份
            
            - 时间: $(date '+%Y-%m-%d %H:%M:%S')
            - 数据库: heat_treatment
            - 触发方式: ${{ github.event_name }}
